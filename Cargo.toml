[package]
name = "debian-codegraph-client"
version = "0.1.0"
edition = "2021"
description = "Symbolize a coredump and open it in codegraph.jelmer.uk"
license = "Apache-2.0"

[[bin]]
name = "codegraph-symbolize"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
rustix = { version = "1.1.4", features = ["system"] }
